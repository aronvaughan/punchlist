# gitleaks config for scripts/publish.sh. Extends the default rules; allowlists only the
# obviously fake tokens the tests use to exercise the govern classifier and the save API.
[extend]
useDefault = true

[allowlist]
description = "test fixtures: placeholder PUNCHLIST_TOKEN values"
paths = ['''^test/.*\.test\.js$''']
regexes = ['''PUNCHLIST_TOKEN=(a1b2c3d4e5f6){2}a1b2c3d4|PUNCHLIST_TOKEN=abcdef0123456789abcdef0123456789''']

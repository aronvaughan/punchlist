<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>punchlist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F766E'/%3E%3Cpath d='M28 53l16 16 28-34' stroke='%23FFFFFF' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="/theme-boot.js"></script>
  <link rel="stylesheet" href="/vendor/webawesome/styles/webawesome.css" data-webawesome="/vendor/webawesome">
  <link rel="stylesheet" href="/tokens.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="shell">
    <header id="topbar">
      <button id="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
      <input id="quickadd" type="text" autocomplete="off" enterkeyhint="done"
             placeholder="New task…  #tag @project !due ^when >agent  (n)" aria-label="Quick add">
      <input id="search" type="search" autocomplete="off" placeholder="Search (/)" aria-label="Search">
    </header>
    <nav id="rail" aria-label="Views and projects">
      <div id="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Punchlist</span></div>
      <ul id="rail-views">
        <li><a href="#/inbox" data-view="inbox">Inbox</a></li>
        <li><a href="#/today" data-view="today">Today</a></li>
        <li><a href="#/upcoming" data-view="upcoming">Upcoming</a></li>
        <li><a href="#/logbook" data-view="logbook">Logbook</a></li>
        <li><a href="#/agents" data-view="agents">Agents</a></li>
      </ul>
      <div id="rail-projects-head" class="rail-heading">Projects</div>
      <ul id="rail-projects"></ul>
      <button id="rail-new-project" class="rail-project rail-new">+ New project</button>
      <div id="rail-tags-head" class="rail-heading" hidden>Tags</div>
      <ul id="rail-tags"></ul>
      <button id="rail-new-tag" class="rail-project rail-new">+ New tag</button>
      <button id="theme-open" class="rail-project rail-new">◐ Theme</button>
      <div id="rail-foot"></div>
    </nav>
    <main id="main">
      <div id="list-head">
        <h1 id="view-title">Today</h1>
        <div id="filter-chips"></div>
        <p id="view-sub"></p>
      </div>
      <div id="list" aria-live="polite"></div>
    </main>
  </div>

  <wa-drawer id="detail" label="Task" placement="end">
    <div id="detail-body"></div>
  </wa-drawer>

  <wa-dialog id="token-dialog" label="API token" without-header-actions>
    <p>Enter your av-tasks API token. It is stored only in this browser.</p>
    <input id="token-input" type="password" autocomplete="off" aria-label="API token">
    <wa-button slot="footer" id="token-save" variant="brand">Save</wa-button>
  </wa-dialog>

  <wa-dialog id="review-dialog" label="Review">
    <div id="review-report" class="report-body"></div>
    <wa-button slot="footer" id="review-reopen" appearance="plain">Reopen</wa-button>
    <wa-button slot="footer" id="review-approve" variant="brand">Approve</wa-button>
  </wa-dialog>

  <wa-dialog id="tag-dialog" label="New tag">
    <div class="dialog-field">
      <label for="tag-name-input">Name</label>
      <input id="tag-name-input" type="text" autocomplete="off">
    </div>
    <p id="tag-error" class="dialog-error" hidden></p>
    <wa-button slot="footer" id="tag-cancel" appearance="plain">Cancel</wa-button>
    <wa-button slot="footer" id="tag-create" variant="brand">Create</wa-button>
  </wa-dialog>

  <wa-dialog id="theme-dialog" label="Theme">
    <div id="theme-choices" class="theme-choices"></div>
  </wa-dialog>

  <wa-dialog id="window-dialog" label="Due soon window">
    <div class="dialog-field">
      <label for="window-input">Days ahead (1–365)</label>
      <input id="window-input" type="number" min="1" max="365" inputmode="numeric">
    </div>
    <wa-button slot="footer" id="window-cancel" appearance="plain">Cancel</wa-button>
    <wa-button slot="footer" id="window-ok" variant="brand">Set</wa-button>
  </wa-dialog>

  <wa-dialog id="project-dialog" label="New project">
    <div class="dialog-field">
      <label for="project-name-input">Name</label>
      <input id="project-name-input" type="text" autocomplete="off">
    </div>
    <div class="dialog-field">
      <label for="project-parent-select">Parent</label>
      <select id="project-parent-select"></select>
    </div>
    <p id="project-error" class="dialog-error" hidden></p>
    <wa-button slot="footer" id="project-cancel" appearance="plain">Cancel</wa-button>
    <wa-button slot="footer" id="project-create" variant="brand">Create</wa-button>
  </wa-dialog>

  <wa-dialog id="when-dialog" label="Schedule for…">
    <input id="when-date-input" type="date" aria-label="When date">
    <wa-button slot="footer" id="when-cancel" appearance="plain">Cancel</wa-button>
    <wa-button slot="footer" id="when-ok" variant="brand">Set</wa-button>
  </wa-dialog>

  <div id="backdrop"></div>
  <div id="toasts" aria-live="assertive"></div>
</body>
</html>
